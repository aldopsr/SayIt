# Konfigurasi SayIt. Ubah nilai di sini, bukan di kode.

audio:
  sample_rate: 16000
  record_seconds: 5.0
  beep_before_record: true      # penanda mulai merekam, mencegah suku kata pertama terpotong
  beep_hz: 880
  beep_ms: 150
  gap_after_beep_ms: 150

stt:
  model_size: small             # hasil Fase 0: small + prompt, WER 7-8% (1 penutur)
  device: cpu                   # "cuda" bila ingin memakai GPU NVIDIA
  compute_type: int8
  language: id
  beam_size: 5
  vad_filter: true
  use_prompt: true              # tanpa prompt WER naik ke 27,5% pada Fase 0
  # Kata yang TIDAK ada di sini jauh lebih sering salah ditranskrip (tanpa prompt
  # WER naik 7% -> 27%). Jadi setiap perintah yang diucapkan aplikasi ke pengguna
  # WAJIB ada di sini - termasuk "sayit", nama yang tidak ada di kamus Whisper dan
  # justru jadi satu-satunya pintu masuk pengguna baru lewat "apa itu SayIt".
  initial_prompt: >-
    SayIt, uang, rupiah, nominal, kembalian, baca, bacakan, tulisan, dokumen, surat,
    kedaluwarsa, expired, tanggal, ulangi, lanjut, foto lagi, bantuan, keluar,
    putar kamera, ganti kamera, pilih berkas, apa itu SayIt
  min_chars: 2                  # transkrip lebih pendek dari ini dianggap kosong
  max_no_speech_prob: 0.6       # segmen dengan peluang "tidak ada suara" di atas ini diabaikan

tts:
  engine: edge                  # edge-tts: suara neural Microsoft, dipilih 28-10 karena jauh lebih manusiawi
  voice: id-ID-GadisNeural      # hanya untuk engine edge (pilihan lain: id-ID-ArdiNeural)
  rate: "+0%"                   # hanya untuk engine edge, mis. "-8%" untuk lebih lambat
  lang: id                      # hanya untuk engine gtts
  tld: com                      # hanya untuk engine gtts
  timeout_s: 8
  cache_dir: assets/tts         # klip tetap dan kata angka (dibuat oleh scripts/build_tts_cache.py)
  cache_dynamic_text: false     # teks dinamis (isi dokumen) TIDAK disimpan ke disk demi privasi
  word_gap_ms: 40               # jeda antar-klip kata
  pause_short_ms: 250           # jeda pengganti koma
  pause_long_ms: 450            # jeda pengganti titik

router:
  min_score: 2
  fuzzy_min_len: 6              # fuzzy matching hanya untuk kata kunci >= 6 huruf
  fuzzy_threshold: 85

vision:
  # Ambang di bawah ini masih berupa NILAI AWAL PRD 8.2, BELUM dikalibrasi dengan foto tim.
  # Jangan diklaim sebagai hasil kalibrasi. Kalibrasi ulang cukup mengubah angka di sini.
  quality_gate:
    # Objek yang menempel tepi bingkai dianggap TERPOTONG, dan pengguna diminta
    # mundur. Dipakai modul uang lewat `MoneyResult.notes['terpotong']`.
    # Arah (kiri/kanan) SENGAJA tidak diberikan: kamera bawaan adalah kamera DEPAN
    # dan pratinjaunya dicerminkan CSS sementara gambar ke server tidak, jadi
    # "kanan" pada gambar bukan "kanan" bagi pengguna. Arah yang salah lebih
    # berbahaya daripada tanpa arah. Klien harus mengirim `facingMode` dulu.
    framing:
      enabled: true
      edge_margin_ratio: 0.02   # 2% sisi bingkai sudah dianggap menempel tepi
    enabled: true
    blur:
      enabled: true
      # DITURUNKAN 100 -> 15 pada 19-11 setelah uji lapangan, dan dasarnya diukur.
      #
      # Masalahnya bukan foto pengguna, melainkan ambangnya: 100 dikalibrasi pada
      # foto UTUH, sedangkan aplikasi mengirim POTONGAN ketat sebatas kurung jingga
      # (sisi pendek 841 px, terbaca dari log `[quality]`). Diuji pada 15 kemasan
      # yang TERBUKTI TERBACA sistem, dipotong dan diskalakan seperti aplikasi
      # memotong, EMPAT di antaranya jatuh di bawah 100:
      #
      #   berkas         utuh    dipotong+841
      #   20270906       86,1        48,4
      #   merica        149,4        87,9
      #   permen1        34,7        23,4
      #   permen2        29,8        19,3
      #
      # Foto lapangan pengguna 19-11 jatuh di pita yang sama: 16,3 / 21,9 / 22,5 /
      # 31,4 / 38,0 / 38,2 / 40,2 - tujuh percobaan, nol yang lolos.
      #
      # Sebabnya: variance of Laplacian mengukur KEKAYAAN TEPI, bukan ketajaman
      # semata. Latar penuh tekstur (meja, keyboard) menaikkannya; permukaan plastik
      # mengkilap yang memenuhi bingkai menurunkannya. Jadi makin BENAR pengguna
      # membingkai objeknya, makin RENDAH skornya - ambang lama menghukum
      # pembidikan yang baik.
      #
      # 15 dipilih karena ia di bawah 19,3, skor TERENDAH di antara foto yang
      # terbaca BENAR. Di bawah itu tidak ada dasarnya; di atas itu ada foto sah
      # yang ditolak.
      #
      # HARGANYA, dan ini nyata: foto yang benar-benar buram kini SAMPAI ke OCR.
      # Akibatnya bukan jawaban salah - penjaga hilir sudah ada (`unclear_score_min`
      # untuk dokumen, dan jawaban "tidak menemukan tanggal" untuk kedaluwarsa) -
      # melainkan latensi yang terbuang pada foto yang memang tidak terbaca.
      #
      # YANG BELUM DIUKUR dan menentukan angka yang benar-benar tepat: pada nilai
      # blur berapa OCR mulai gagal. Itu butuh sapuan blur lawan keterbacaan, dan
      # belum pernah dijalankan. Sampai itu ada, 15 adalah batas yang SAH dari data,
      # bukan nilai optimal.
      min_variance: 15.0        # variance of Laplacian, di bawah ini dianggap buram
      resize_short_side: 720    # gambar dinormalisasi dulu agar ambang tidak ikut berubah saat resolusi kamera berbeda
    dark:
      enabled: true
      max_mean: 60.0            # rata-rata intensitas grayscale
    bright:
      enabled: true
      # PRD 8.2 menulis 220, tetapi itu menolak foto dokumen yang sah: halaman putih
      # berlatar 230-240 punya mean 226-236 dengan piksel jenuh 0,00 dan tulisan tajam.
      # Penjaga silau yang sebenarnya adalah proporsi piksel jenuh di bawah ini;
      # mean hanya menangkap kasus ekstrem. Angka 245 belum dikalibrasi dengan foto HP.
      min_mean: 245.0
      saturated_level: 250      # piksel >= nilai ini dihitung jenuh
      max_saturated_ratio: 0.25 # silau lokal: mean masih wajar tapi sebagian besar frame jenuh
    resolution:
      enabled: true
      min_short_side: 480       # sisi terpendek dalam piksel

  # Pra-pemrosesan PRD 8.3. Setiap langkah bisa dimatikan sendiri untuk uji ablasi Fase 4.
  # "chains" menentukan urutan langkah per modul; nama langkah harus ada di "steps".
  preprocess:
    enabled: true
    steps:
      resize:                   # normalisasi ukuran, rasio dipertahankan, hanya memperkecil
        enabled: true
        max_side: 1600
      clahe:                    # perbaikan kontras pada kanal L (ruang warna LAB)
        enabled: true
        clip_limit: 2.0
        tile_grid: 8
      denoise:
        enabled: true
        method: bilateral       # "bilateral" (cepat, default tim) atau "nlm" (lebih bersih, jauh lebih lambat)
        bilateral:
          diameter: 9
          sigma_color: 75
          sigma_space: 75
        nlm:
          h: 18                 # disetel pada derau sintetis sigma 25 (h=10 kurang kuat); cek ulang dengan foto asli
          template_window: 7
          search_window: 21
      perspective:              # deteksi kontur kertas (Canny + approxPolyDP) lalu warp
        enabled: true
        blur_ksize: 5
        canny_low: 50
        canny_high: 150
        approx_epsilon_ratio: 0.02
        # Dinaikkan dari 0,25 (29-09) setelah ablasi pada 13 dokumen. Pada 0,25 langkah ini
        # menyala di 1 dari 13 foto dan ketiganya salah: `r (5).JPG` dikira memuat kertas
        # seluas 26,2% bidang, lalu dipotong dari 1200x1600 menjadi 793x649 sehingga sebagian
        # besar halaman hilang (CER foto itu 42,7%, padahal tanpa pra-pemrosesan 3,1%).
        # Nol deteksi benar, satu deteksi salah. Pada 0,50 salah kenal itu hilang dan CER
        # rerata turun 20,2% -> 17,2%.
        min_area_ratio: 0.50    # kandidat kertas minimal 50% luas gambar, agar objek kecil tidak ikut
        max_area_ratio: 0.95    # di atas ini yang "ditemukan" adalah bingkai gambar, bukan kertas (terbukti pada citra acak: 0,977)
      deskew:                   # koreksi kemiringan dari minAreaRect
        enabled: true
        max_angle_deg: 15.0     # di atas ini dianggap salah ukur, rotasi dibatalkan
        min_angle_deg: 0.3      # di bawah ini tidak usah diputar, rotasi hanya menambah blur
      upscale:                  # pembesaran crop kedaluwarsa
        enabled: true
        factor: 2.0
        interpolation: cubic
      threshold:                # adaptive thresholding (Gaussian)
        enabled: true
        block_size: 31          # wajib ganjil
        c: 10
      morphology:               # menyambung titik cetakan dot-matrix
        enabled: true
        op: close               # "close" atau "dilate"
        kernel: 3
        iterations: 1
    chains:
      # CLAHE DIBUANG 28-10. Alasannya bukan selera melainkan ketidakcocokan latih-pakai:
      # notebook k-fold melatih model pada gambar ASLI (tidak ada CLAHE di jalur latihnya
      # sama sekali), sedangkan aplikasi dulu menerapkan CLAHE saat inferensi. Akibatnya
      # angka tolok ukur 90,1% diukur TANPA CLAHE sementara aplikasi berjalan DENGAN CLAHE,
      # dan selisihnya tidak pernah terlihat karena keduanya tak pernah diukur berdampingan.
      # Terukur: model v1 pada 32 foto bersih 65,6% (dengan) lawan 87,5% (tanpa);
      # model v2 pada 81 foto 96,3% lawan 97,5%, latensi 46,9 ms lawan 30,8 ms.
      # `resize` WAJIB tetap ada: ia pengendali latensi untuk foto HP 3024x4032.
      # Langkah `clahe` TIDAK dihapus dari `steps` dan tetap dipakai rangkaian dokumen.
      uang: [resize]
      # `denoise` dibuang dari rangkaian dokumen (29-09): pada 13 dokumen ia menaikkan CER
      # 2,0-2,2%. Bilateral mengaburkan huruf halus, dan foto dokumen yang tajam memang tidak
      # punya derau yang perlu dibuang. Langkahnya tetap ada dan tetap dipakai rangkaian
      # kedaluwarsa, tempat cetakan dot-matrix memang berderau.
      dokumen: [resize, perspective, deskew, clahe]
      # Binarisasi dan morfologi DIBUANG 30-09. Diuji lima rangkaian pada 9 potongan zona
      # dari foto kemasan sungguhan: `kedaluwarsa` lama (upscale+clahe+denoise+threshold+
      # morphology) memberi 0 benar dan hampir selalu menghasilkan teks kosong atau nyaris
      # kosong ('', '4 95.', '(,', 'IU.', '{.', 'EX.'). `upscale+clahe` memberi 2 benar.
      # Threshold menghapus cetakan dot-matrix alih-alih menyambungnya - kebalikan dari
      # dugaan PRD 8.8 langkah 3. Langkahnya tetap ada di `steps` bila mau dicoba lagi.
      kedaluwarsa: [upscale, clahe]
      # Hanya normalisasi ukuran, tanpa perbaikan citra apa pun. Dibuat 02-10 setelah
      # pengukuran NFR-01: mematikan pra-pemrosesan kedaluwarsa demi akurasi ternyata
      # juga mematikan `resize`, sehingga foto 3024x4032 utuh masuk ke PaddleOCR dan
      # latensinya meledak sampai 116 detik. Langkah `resize` bukan hanya perbaikan
      # citra - ia pengendali latensi, dan harus tetap ada.
      hanya_resize: [resize]

  # Modul uang (PRD 8.6). Bobot tidak ikut Git; lihat models/README.md.
  money:
    weights: models/best_money.pt
    device: cpu                 # "cuda" bila ingin memakai GPU NVIDIA
    imgsz: 640
    max_det: 50
    augment: false              # test-time augmentation; lihat sapuan 06-10 di keputusan-teknis
    # Buang deteksi yang skornya di bawah (rasio x skor tertinggi di foto itu).
    # 0 mematikan. Disetel dari sapuan 22-10; lihat docs/keputusan-teknis.md.
    relative_score_min: 0.80
    # PRD 8.9 menulis 0,5. Dipakai 0,30 setelah SAPUAN K-FOLD BERSIH (22-10):
    # tiap foto dinilai model yang belum pernah melihatnya, 48 foto layak nilai.
    #
    #   ambang   BENAR  SALAH  DIAM   akurasi  presisi
    #     0,25     34      5     9     70,8%    87,2%
    #     0,30     33      4    11     68,8%    89,2%   <- dipakai
    #     0,40     32      4    12     66,7%    88,9%   <- nilai lama
    #     0,50     29      3    16     60,4%    90,6%
    #
    # Dipilih 0,30, bukan 0,25 yang akurasinya lebih tinggi: 0,25 menukar satu
    # jawaban BENAR dengan satu jawaban SALAH, dan PRD 8.9 mengutamakan presisi
    # di atas recall. Bagi pengguna tunanetra nominal yang keliru lebih berbahaya
    # daripada sistem yang diam - ia tidak punya cara memeriksanya.
    # Terhadap nilai lama 0,40, pilihan ini menang di KEDUA kolom sekaligus.
    #
    # Catatan: hanya 5 dari 12 DIAM bisa diselamatkan dengan menurunkan ambang.
    # Sisanya tidak punya deteksi sama sekali bahkan di 0,15 - itu batas model,
    # bukan batas ambang, dan hanya bisa diperbaiki dengan data atau model baru.
    score_min: 0.30
    nested_area_ratio: 0.85     # kotak yang >= 85% luasnya di dalam kotak sekelas dianggap uang yang sama
    # Kotak sekelas yang tumpang tindih >= ambang ini digabung (NMS per kelas).
    # DIMATIKAN (0) secara bawaan. Mekanismenya ada dan ada tesnya, tetapi sapuan
    # 06-10 pada 35 foto menunjukkan **nol efek** pada ambang 0,20 sampai 0,70:
    # salah hitung lembar yang ditemukan ternyata BUKAN kotak ganda atas lembar yang
    # sama, melainkan deteksi di wilayah foto yang berbeda (IoU hanya 0,198), jadi
    # penggabungan IoU tidak menyentuhnya. Dibiarkan mati karena risikonya pada foto
    # BANYAK LEMBAR belum bisa diuji - dua lembar bertumpuk bisa tergabung menjadi
    # satu, dan kita belum punya foto banyak lembar untuk membuktikannya aman.
    same_class_iou: 0.0
    conflict_iou: 0.5           # dua kelas berbeda tumpang tindih di atas ini -> hasil ditandai tidak yakin
    preprocess_chain: uang      # kosongkan (null) bila citra sudah diproses oleh pemanggil

  # Parser tanggal kedaluwarsa (PRD 8.8.1).
  date_parser:
    day_first: true             # asumsi urutan Indonesia: hari sebelum bulan
    years_back: 5               # tanggal lebih tua dari ini ditolak sebagai salah baca
    years_forward: 10
    two_digit_year_base: 2000   # "27" dibaca 2027
    marker_window: 24           # jarak maksimum (karakter) antara penanda dan tanggal
    # Penanda NEGATIF: angka di dekatnya BUKAN tanggal kedaluwarsa, melainkan kode
    # produksi atau nomor bets. Dicari di DUA sisi (penanda positif hanya dicari ke
    # belakang) dan dengan jendelanya sendiri yang lebih lebar.
    #
    # Dibuat setelah `chees` 19-11: OCR membaca
    #   '... 210526 MAR CISTONERSERTICE 0 /Production Code BestBeftore Kode Produksi/'
    # Parser menjawab 2026-05-21 dari `210526`, padahal kemasannya sendiri menulis
    # bahwa angka itu kode produksi - labelnya cuma kebetulan berada SESUDAH angkanya,
    # di luar jangkauan penanda positif yang hanya melihat ke belakang.
    #
    # Kandidat yang punya penanda POSITIF sendiri dikecualikan, supaya
    # "EXP 110426 KODE PRODUKSI 220517" tetap menjawab dari yang berpenanda EXP.
    #
    # BUKAN pengganti `require_marker_for_compact`, yang sudah diukur merugikan
    # (menyalakannya memberi 56% lawan 75%). Ini jauh lebih sempit: ia hanya
    # menolak yang terbukti berlabel kode produksi, bukan mewajibkan penanda
    # untuk SEMUA tanggal rapat.
    negative_markers: [kode produksi, production code, kode prod, batch, no bets, nomor bets]
    negative_marker_window: 40
    # Tanggal rapat tanpa pemisah (210829) wajib punya penanda di dekatnya, sebab enam
    # angka berderet juga bisa nomor bets atau kode produksi.
    #
    # DIMATIKAN 30-09 setelah diukur pada 21 foto (16 utuh + 5 potongan), dengan OCR
    # dijalankan sekali lalu teksnya diurai pada kedua kondisi:
    #   wajib penanda  -> BENAR 3, SALAH 1, DIAM 17
    #   dilonggarkan   -> BENAR 8, SALAH 1, DIAM 12
    # Lima jawaban benar bertambah dan jumlah jawaban SALAH sama sekali tidak bergerak.
    #
    # PERINGATAN: nol tambahan jawaban salah itu mungkin ARTEFAK. EasyOCR membaca sangat
    # sedikit teks pada kemasan ini (beberapa foto kosong sama sekali), jadi hampir tidak
    # ada kode bets yang bisa disalahbaca. `tests/test_date_parser.py` membuktikan
    # bahayanya nyata: "NO BETS 210829 ISI 250 G" lolos menjadi tanggal saat dilonggarkan.
    # ULANGI PENGUKURAN INI setiap kali mesin OCR diganti (mis. ke PaddleOCR).
    require_marker_for_compact: false
    # Tanggal berpemisah SPASI (`EXP 08 10 26`), pola `dmy_spasi`, ditambahkan 01-10.
    # Spasi sengaja TIDAK dimasukkan ke daftar pemisah biasa: pola ini mewajibkan
    # ketiga kelompok angka ada, sehingga "01/01/2026 12/12/2027" tetap terurai
    # menjadi dua tanggal (ada tes regresinya).
    # Saklarnya dipisah dari `require_marker_for_compact` karena risikonya berbeda
    # dan keduanya terbukti harus diukur sendiri-sendiri.
    require_marker_for_spaced: true
    markers:                    # penanda yang menaikkan prioritas sebuah tanggal
      - exp
      - expired
      - exp date
      - expiry
      - ed
      - bb
      - bbe
      - best before
      - use by
      - kedaluwarsa
      - kadaluwarsa
      - kadaluarsa
      - baik digunakan sebelum
      - sebaiknya digunakan sebelum

  # Modul dokumen (PRD 8.7). Bobot EasyOCR diunduh otomatis saat pertama dipakai.
  document:
    engine: easyocr             # "easyocr" atau "paddleocr"; lihat ablasi PRD nomor 2
    paddle:                     # hanya dipakai bila engine = paddleocr
      # PERINGATAN (07-10): begitu `text_detection_model_name` diisi, PaddleOCR
      # MENGABAIKAN `lang` dan `ocr_version` - lognya menyebut itu sendiri, dan
      # pengenal yang dipakai jadi PP-OCRv6_medium_rec, bukan latin_PP-OCRv5.
      # Angka 81% diukur dengan konfigurasi ini apa adanya, jadi tetap sah; yang
      # salah hanya anggapan bahwa pengenal Bahasa Indonesia yang dipakai.
      lang: id                  # DIABAIKAN selama text_detection_model_name diisi
      # PP-OCRv6 (bawaan paddleocr 3.7) menabrak NotImplementedError di oneDNN pada
      # paddlepaddle 3.3.1, jadi versi model dipaksa v5 dan oneDNN dimatikan.
      ocr_version: PP-OCRv5
      enable_mkldnn: false
      # Model deteksi bawaan adalah versi `server` yang berat. Terukur 02-10 pada
      # kecapasin: server 10,9 s (800 px) / 18,5 s (1200 px); mobile 2,5 s pada kedua
      # ukuran, dan tanggalnya tetap terbaca. Kosongkan untuk memakai bawaan.
      text_detection_model_name: PP-OCRv5_mobile_det
      # Model PENGENALAN. Biaya PaddleOCR pada dokumen padat teks ada di sini, bukan
      # di deteksi: 41,8 detik/halaman (02-10), dan memperkecil gambar hampir tidak
      # menolong karena biayanya per BARIS. Kosongkan untuk memakai bawaan.
      text_recognition_model_name:
      text_recognition_batch_size:
      # Pengklasifikasi orientasi BARIS: menegakkan teks terbalik sebelum dikenali.
      use_textline_orientation: false
    languages: [id, en]
    # Sudut tambahan yang dicoba EasyOCR per baris teks. Kosong = mati.
    # Pada foto dunia nyata teks terbalik terbaca jadi sampah ('wejes BundoL uejues');
    # pada dokumen A4 hampir tidak berguna karena halamannya sudah tegak.
    # SEDANG DIKALIBRASI 31-10 - jangan dinyalakan sebelum ablasinya selesai.
    rotation_info: []
    # Percobaan ulang dengan memutar SELURUH gambar - bukan tiap baris. Diukur
    # 31-10 pada 13 dokumen yang diputar 180 derajat: per-baris (rotation_info)
    # hanya memulihkan CER 96,2% -> 68,8% dengan biaya 5,2x; memutar seluruh
    # gambar memulihkannya ke 15,3%, sama persis dengan baseline tegak.
    # Yang gagal pada gambar terbalik adalah DETEKSI (193 kotak lawan 887).
    rotate_retry: [180, 90, 270]
    # Pemicunya: skor rata-rata baris di bawah ambang ini.
    # DIKALIBRASI 31-10 pada 14 foto buku dari HP pengguna, 5 di antaranya
    # terpotret miring tanpa disengaja. Pemisahannya BERSIH: foto tegak serendah
    # 0,768, foto miring setinggi 0,715 - celah 0,053, dan 0,75 jatuh di dalamnya.
    # Hasilnya 5/5 foto miring terdeteksi, 0/9 foto tegak salah terpicu.
    # Pemulihannya besar: 16->133, 26->180, 49->160, 46->167, 79->247 kata.
    # Pada 13 dokumen yang diputar buatan celahnya jauh lebih tipis (0,009), jadi
    # angka ini berdiri di atas foto HP sungguhan, bukan dokumen yang diputar skrip.
    # Kosongkan (null) untuk mematikan.
    rotate_trigger_score: 0.75
    gpu: false                  # kode harus tetap jalan di laptop tanpa GPU
    model_dir: models/easyocr   # disimpan di dalam proyek, diabaikan Git
    download_enabled: true      # false = hanya pakai bobot yang sudah ada, tidak menyentuh internet
    text_score_min: 0.4         # PRD 8.9. Catatan: EasyOCR mengembalikan kotak setingkat BARIS,
                                # jadi yang dibuang adalah satu baris utuh, bukan satu kata
    line_tolerance_ratio: 0.6   # dua kata sebaris bila beda pusat vertikalnya < rasio ini x tinggi huruf
    # Luruskan kemiringan baris sebelum dikelompokkan, ditaksir dari kotak OCR
    # sendiri. `deskew` tidak bisa menggantikan ini: ia memakai minAreaRect atas
    # seluruh piksel, jadi pada foto buku yang dipegang ia mengukur bentuk
    # halaman dan meja, bukan baris teksnya. Terukur 31-10: satu baris membentang
    # dari y=99 ke y=56 (miring ~6 derajat) dan baris-baris saling menyisip.
    # Cara membentuk baris. `pita` membandingkan pusat vertikal terhadap nilai
    # tengah baris berjalan (dengan koreksi kemiringan di bawah). `rantai`
    # menyambung tiap kotak ke tetangga terdekatnya, tanpa taksiran kemiringan
    # sama sekali, sehingga baris yang MELENGKUNG diikuti apa adanya.
    # BAWAANNYA DIGANTI KE `rantai` PADA 17-11, dan buktinya datang dari modul
    # KEDALUWARSA - bukan dari foto buku yang sejak 31-10 ditunggu teks acuannya.
    #
    #   modul         pita                  rantai
    #   kedaluwarsa   12 BENAR/3 SALAH/1 DIAM = 75%   13/2/1 = 81%  <- menang
    #   dokumen       CER 14,89%, median 8,10 s        14,94%, 8,12 s
    #
    # Kedaluwarsa: hanya SATU berkas berubah, `mentega` SALAH -> BENAR, nol
    # regresi pada 15 lainnya. Sebabnya tanggalnya tercetak DIAGONAL (x turun
    # saat y naik), kemiringan sejatinya -0,418 - di atas `line_slope_max` 0,35
    # sehingga dibuang jadi 0 - dan taksiran median seluruh potongan hanya
    # -0,196 karena blok tabel gizi di atasnya hampir datar. Satu angka
    # kemiringan tidak muat untuk dua blok berorientasi berbeda, masalah yang
    # SAMA dengan halaman buku melengkung. `rantai` tidak menaksir kemiringan
    # sama sekali, jadi ia mengikuti cetakan semiring apa pun.
    #
    # Dokumen: +0,05 poin CER (1 membaik `r (10)`, 1 memburuk `r (4)`, 11 tetap)
    # = di dalam derau, direproduksi persis dari pengukuran 31-10.
    # **PERINGATAN: margin target PRD <= 15% menyusut dari 0,11 ke 0,06 poin.**
    # Perubahan berikutnya yang menambah 0,06 poin saja akan membuatnya gagal.
    #
    # Yang BELUM terbukti dan tetap perlu teks acuan foto buku: keunggulan
    # `rantai` pada halaman MELENGKUNG. Penggantian ini dibenarkan oleh angka
    # kedaluwarsa, bukan oleh klaim foto buku yang masih penilaian mata.
    line_grouping: rantai       # pita | rantai
    line_slope_correct: true
    line_slope_gap_ratio: 3.0   # celah mendatar maksimum antar-kata sebaris, x tinggi huruf
    line_slope_max: 0.35        # taksiran di atas ini dianggap liar dan dibuang (~19 derajat)
    paragraph_gap_ratio: 1.6    # jarak antar-baris di atas rasio ini dianggap ganti paragraf
    max_words_per_chunk: 40     # PRD 8.7, potongan yang dibacakan sekali jalan
    # --- pembacaan per pita ---------------------------------------------------
    # OCR dijalankan atas N potongan mendatar, bukan seluruh halaman sekali.
    # MEMOTONG, bukan memperkecil: sapuan `max_side` 16-11 membuktikan memperkecil
    # gambar membuat deteksi MEMECAH baris (CER 14,89% -> 20,17% pada 1000 px),
    # sedangkan memotong tidak menyentuh tinggi huruf sama sekali.
    #
    # Disapu 16-11 pada 13 dokumen beracuan (prototipe):
    #
    #   pita    CER     kata pertama   total
    #     1   14,89%        13,58 s   13,58 s
    #     2   14,57%         4,67 s    8,59 s   <- dipakai, menang di KETIGA sisi
    #     3   17,36%         3,75 s   11,08 s
    #     4   15,37%         3,60 s   15,86 s
    #
    # 3 pita merugikan tajam (`r (11)` 21,1% -> 32,5%, `r (3)` 18,7% -> 27,6%):
    # makin banyak potongan, makin besar peluang satu paragraf terbelah. 2 pita
    # satu-satunya titik yang tidak membayar apa pun.
    #
    # PERINGATAN: tabel di atas diukur pada PROTOTIPE yang memakai detect+recognize
    # terpisah, bukan `readtext` seperti produksi, dan jalur itu 1,8x lebih lambat.
    # Jadi RASIO-nya sah tetapi detiknya tidak sebanding dengan angka produksi.
    # Bawaannya tetap 1 sampai disapu di jalur produksi lewat
    # `scripts/ukur_dokumen.py --pita 2`.
    bands: 1
    # Tumpang-tindih tiap sisi potongan, relatif tinggi gambar. Pada 1600 px ini
    # ~64 piksel, sekitar dua baris teks. Pita tetap hanya MEMILIKI kotak yang
    # pusatnya ada di wilayahnya sendiri, jadi tumpang-tindih tidak menggandakan
    # apa pun - ia hanya memberi ruang agar baris di batas pita terdeteksi utuh.
    band_pad_ratio: 0.04
    preprocess_chain: dokumen   # kosongkan (null) bila citra sudah diproses pemanggil

    # --- urutan bacaan -------------------------------------------------------
    # `auto` SUDAH DIUKUR DAN DITOLAK (31-10). Gagasannya memilih dari
    # `document_found` milik koreksi perspektif, tetapi hasilnya PERSIS TERBALIK:
    # kertas "ditemukan" pada 2 foto papan nama, dan TIDAK ditemukan pada
    # seluruh 13 dokumen A4. Penyebabnya `perspective.min_area_ratio` 0,50 yang
    # memang sengaja dibuat ketat, jadi sinyal itu tidak pernah menyala pada
    # foto dokumen sungguhan. Nilainya tetap diterima untuk ablasi, tetapi
    # jangan dipakai sebagai bawaan.
    #
    # Bawaannya `tersebar` karena pada 13 dokumen beracuan ia hanya berbeda
    # 0,05 poin CER dari mode `dokumen` (15,30% lawan 15,25%) - dalam derau -
    # sementara pada teks tersebar ia memperbaiki urutan bacaan.
    layout_mode: tersebar       # auto | dokumen | tersebar
    # Ambang gugus mode `tersebar`, relatif terhadap tinggi huruf. Dua kotak
    # masuk satu gugus bila jarak kosongnya di bawah keduanya.
    cluster_x_gap_ratio: 1.5
    cluster_y_gap_ratio: 1.0
    # Gugus yang tepi atasnya jatuh di pita setinggi ini dianggap sebaris dan
    # dibaca dari kiri ke kanan.
    cluster_band_ratio: 2.0

    # --- penjaga mutu bacaan -------------------------------------------------
    # Bacaan yang lolos tetapi meragukan dijawab "tulisannya kurang jelas"
    # alih-alih dibacakan apa adanya.
    #
    # DIKALIBRASI 31-10 pada 35 foto (13 dokumen beracuan + 22 foto lain):
    # ambang 0,75 menangkap 6 dari 8 bacaan buruk dan SALAH MENANDAI 0 dari 27
    # bacaan baik. Termasuk yang tertangkap: `ketentuan_makalah`, satu-satunya
    # dokumen ber-CER 76,9%. Dua yang lolos adalah bacaan nyaris kosong tetapi
    # berskor tinggi (1-2 kata). Marginnya tipis: buruk tertinggi 0,746 lawan
    # baik terendah 0,768. Di 0,78 sudah ada 2 bacaan baik yang salah ditandai.
    unclear_score_min: 0.75
    # Penanda kedua (rasio baris lolos terhadap yang terdeteksi) TIDAK TERBUKTI
    # dan karena itu dimatikan. Diukur pada data yang sama: pada ambang 0,40 ia
    # menangkap 3 bacaan buruk, tetapi KETIGANYA sudah tertangkap oleh skor -
    # nol tambahan. Menaikkannya ke 0,45 mulai salah menandai bacaan baik.
    # Kodenya ditahan karena sudah berteskan, tetapi jangan dinyalakan tanpa
    # mengukur ulang: pada data ini ia tidak membayar dirinya sendiri.
    unclear_kept_ratio_min:

  # Modul kedaluwarsa (PRD 8.8).
  # PERINGATAN: bobot deteksi zona BELUM ADA (datasetnya belum dibuat). Selama file
  # zone_weights tidak ditemukan, modul otomatis memakai jalur cadangan FR-12:
  # OCR seluruh gambar, dan hasilnya selalu ditandai kurang yakin.
  expiry:
    # Mesin OCR khusus modul ini; kosongkan untuk memakai mesin yang sama dengan
    # modul dokumen. Dipisah 02-10 setelah ablasi pada 16 kemasan dan 13 dokumen:
    #   kedaluwarsa  EasyOCR 44%  ->  PaddleOCR 81%   (target PRD >= 70% terlampaui)
    #   dokumen      EasyOCR 7,3 s/halaman  ->  PaddleOCR 41,8 s/halaman
    # PRD NFR-01 membatasi latensi end-to-end 8 detik, jadi modul dokumen tetap
    # EasyOCR sementara modul kedaluwarsa memakai PaddleOCR. Dua mesin dalam satu
    # proses sudah diuji dan aman dengan mobile_det (crash 01-10 disebabkan
    # server_det pada foto 3024x4032, bukan oleh koeksistensi mesin).
    engine: paddleocr
    zone_weights: models/best_zone.pt
    device: cpu
    imgsz: 640
    max_det: 10
    zone_score_min: 0.40        # PRD 8.9, di bawah ini jalur cadangan yang dipakai
    # Nama kelas model zona. TIDAK BERPENGARUH pada bobot yang terpasang sekarang
    # (`best_zone.pt`, 1 kelas `expired_date_zone`): zona tanpa nama kelas tidak
    # pernah dibuang, dan bila tidak ada kelas `date` pilihannya kembali ke skor
    # tertinggi. Baru berguna setelah model 4 kelas dipasang.
    #
    # Dengan 4 kelas, wilayah kode produksi ditolak SEBELUM OCR. Itu menyerang akar
    # jawaban salah `chees` dari sisi yang benar: dari sisi parser sudah dicoba
    # 20-11 dan gagal, karena teks OCR-nya tidak memuat label "Kode Produksi"
    # sama sekali ('man.yeg Bes 0re Cae 0 T7 WOR SUCALNED 210526/ en im ua.').
    #
    # Nama kelas mengikuti dataset 4 kelas yang beredar (`date` / `code` / `due` /
    # `prod`), mis. `esigelec-rniez/expiry` di Roboflow: 700 gambar, bersplit
    # train/valid/test.
    zone_classes_date: [date]
    zone_classes_reject: [code, prod]
    crop_margin_ratio: 0.10     # PRD 8.8 langkah 2
    # Hanya `resize`, tanpa perbaikan citra. Dua alasan terukur yang berbeda:
    #   akurasi - dengan PaddleOCR, CLAHE dan upscale MERUGIKAN modul ini
    #             (69% lawan 81% pada 16 kemasan); dengan EasyOCR justru membantu +6%.
    #   latensi - tanpa `resize` sama sekali, foto 3024x4032 utuh masuk ke PaddleOCR
    #             dan latensinya mencapai 116 detik (NFR-01 membatasi 8 detik).
    # Isi kembali dengan `kedaluwarsa` bila mesinnya dikembalikan ke EasyOCR.
    preprocess_chain: hanya_resize
    retry_without_steps: [threshold, morphology]  # PRD 8.8 langkah 4: ulangi tanpa binarisasi
    fallback_preprocess_chain: hanya_resize       # lihat catatan preprocess_chain di atas
    # Bila potongan zona tidak menghasilkan tanggal, ulangi pada SELURUH gambar sebelum
    # menyerah. Zona adalah petunjuk letak, bukan komitmen: ajinomoto terdeteksi zonanya
    # dengan skor 0,76, gagal dibaca lewat potongan, padahal OCR seluruh gambar membaca
    # `110426` dengan benar. Tanpa saklar ini sistem membuang jawaban yang sudah di tangan.
    full_image_fallback: true
    # Bila potongan zona tidak terbaca, putar POTONGANNYA, bukan gambar penuh.
    # Soalnya apa yang dibayar ulang: satu lintasan gambar penuh = deteksi zona YOLO
    # pada 3000x4000 + potong + OCR; memutar potongan hanya membayar OCR potongan.
    # Zona yang sudah ketemu tidak hilang karena gambar diputar, jadi mendeteksinya
    # ulang tidak membeli apa pun. Uji lapangan 12-11 (Indomie, 44,9 detik): zona
    # ketemu skor 0,755 di lintasan pertama, OCR membaca sampah di keempat rotasi -
    # yang gagal PENGENALAN CETAKAN, dan rotasi gambar penuh tidak menyentuh itu.
    #
    # Konsekuensinya: selama zona ketemu, `rotate_retry` di bawah TIDAK lagi
    # diterapkan pada gambar penuh (lihat `rotate_full_dilewati` di notes).
    # `false` memulihkan perilaku lama persis, untuk ablasi.
    # BELUM DIUKUR pada 16 kemasan - jangan dinyalakan sebelum angkanya ada.
    rotate_crop: false
    text_score_min: 0.4         # ambang kotak OCR, sama dasarnya dengan modul dokumen
    # Dicoba berurutan HANYA bila alur biasa tidak menemukan tanggal. Rotasi EXIF
    # sudah ditangani sayit/gambar.py; ini untuk foto yang EXIF-nya hilang atau
    # salah, misalnya tangkapan layar dan hasil potong. Kosongkan untuk mematikan.
    rotate_retry: [180, 90, 270]

# Perangkaian seluruh modul (PRD 7).
pipeline:
  quality_gate_on_photo: true   # periksa foto saat diambil, bukan saat pertanyaan datang,
                                # agar pengguna bisa langsung foto ulang
  slow_intents: [BACA, KEDALUWARSA]   # intent yang perlu penanda suara "sedang saya proses"

# API web (server/app.py). Keduanya menegakkan aturan aksesibilitas proyek:
# pengguna tunanetra tidak punya petunjuk visual, jadi menunggu harus DIBUNYIKAN.
server:
  # Batas tunggu antrean. Satu Pipeline dipakai bersama, jadi permintaan kedua
  # menunggu. Di bawah batas ini ia menunggu diam-diam (wajar, tidak terasa);
  # di atasnya ia dijawab klip "server_sibuk" supaya tidak ada diam tanpa sebab.
  # 1,5 detik dipilih supaya intent cepat (uang 1,4 s) tetap lolos mengantre.
  antre_timeout_s: 1.5
  # Pemanasan edge-tts: sintesis pertama ~9 detik karena membangun sesi. Bila
  # server start tanpa internet, warmup gagal dan 9 detik itu jatuh tepat di
  # pembacaan dokumen pertama pengguna. Jadi dicoba lagi di latar.
  warmup_retry: 10
  warmup_retry_delay_s: 30
